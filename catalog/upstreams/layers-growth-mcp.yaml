  notes: Hosted, credit-metered service. The documentation read on 2026-09-05 describes pay-as-you-go credits, paid plans, a trial that auto-converts to a paid plan unless cancelled, managed accounts billed from a cash wallet, and human approval for spending and billing changes. Terms were not reviewed by counsel and confer no authority.
