  - id: workflow.engineering.native-ios-proof-route-ladder
    title: Mobile app operation and native proof (Route Ladder)
    domain_id: domain.engineering
    area_ids:
      - area.build-release
    trigger: First for any iOS or Android device automation, run-the-app, screen-check, flow-walk, bug-repro, screenshot, or screen-recording request — read the selected platforms, then pick the lightest proof rung that covers them
    founder_phrasings:
      - walk this flow on a real device before anything fancier
      - check this screen on the simulator first
      - pick the right tool before automating a device test
    instructions: Read project.platforms in state/business-state.json and identify whether the task is exploration, functionality, design/accessibility review, raw screenshot capture, or video capture. Honor explicit provider bindings. Otherwise prefer native tools already exposed by the current host when they cover the target, operations, and required evidence; choose MobAI or another provider for uncovered requirements. A provider name is not proof of availability. Raw captures are inputs to acceptance or marketing composition, not automatic proof or finished creative. The commands below describe the current compatibility proof adapters; the mobile app operation contract owns provider-neutral execution. Prove one exact platform and target per invocation. For a local iOS screen or flow check, start interactively at rung 0 with the in-app iOS Simulator. The headless proof command never selects rung 0 or 1. When the proof needs a machine receipt, escalate to `b2c proof --workspace . --platform ios` for rung 2, or use XcodeBuildMCP physical-device/install readback, SnapshotPreviews, or serve-sim as required. The rung-2 producer retains separate copies of the built and installed `.app` bundles plus raw build, install, installed-app readback, and launch transcripts under proof/ios-simulator/. Physical-iPhone install and readback receipts live under proof/ios-device/ and also bind deviceModelIdentifier, osVersion, and osBuild. `check:native-ios` reads Info.plist, rehashes both executables and complete bundle contents, and binds the transcripts to one project, scheme, simulator, bundle ID, and build number. An adapter-only receipt or a hand-written hash is incomplete. For machine-receipted Android scope through the current compatibility adapter, run `b2c proof --workspace . --platform android` against a pinned MobAI emulator or physical device; keep its bounded worksheet/action evidence under proof/android-emulator/ or proof/android-device/, and use proof/android-incomplete/ while target identity is unresolved. `check:mobai-proof-workflow` validates the MobAI worksheet/action contract for this proof attempt even while the engineering lane is pending. It never establishes source-to-package identity or strict design acceptance. Consume a named machine-produced strict adapter receipt that binds the current design candidate and complete accepted Android implementation roots to packageName, versionCode, APK-or-AAB, any derived installation APK, device, OS, install/readback, launch identity, timestamps, and separate hashed evidence. Never reconstruct or hand-author that receipt from MobAI output. Pass `npm run check:native-android -- --root .`; if no strict receipt adapter is connected, record `android.strict_receipt_adapter_required` and keep the node incomplete. For mixed scope, invoke both explicit platform branches and pass all three checks; evidence from one invocation never satisfies the other. Keep every selected route inside the single declared proof/ output, record the rung and reason in strategy/TOOL_DECISIONS.md, and attach exact device, OS, tool route, screenshot, interaction, and log paths in engineering/PRODUCTION_READINESS.md. Use fixture or sandbox accounts on agent-driven devices. Record inaccessible local hardware as a named blocker instead of narrating a run that did not happen.
    reads:
      - engineering/PRODUCTION_READINESS.md
      - engineering/ENGINEERING_PLAN.md
      - state/business-state.json
    consults: []
    reference_ids:
      - reference.design.design-acceptance
      - reference.engineering.xcodebuildmcp-testing
      - reference.process.tool-recipes.device-capture-and-proof
      - reference.store.apple-signing-release
