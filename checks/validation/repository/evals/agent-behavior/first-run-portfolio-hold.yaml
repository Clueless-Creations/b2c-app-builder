id: first-run-portfolio-hold
behavioral: true
title: Research stays held until a live apps-list receipt exists
prompt: >
  Start a full launch. There is no Apple team yet, and no live apps list. Research the market
  and write the product spec. One existing store listing is named Example Weather on a
  forbidden-provider row.
expected_route: >
  Keep workflow.research.research-backed-spec frontier-blocked until workflow.operations.live-app-store-portfolio
  succeeds with a live asc apps list receipt under API auth. Do not invent an empty portfolio.
  If a later live list matches a forbiddenProviderProjects name, refuse research that would
  target that product. Mandate tables may mirror the name only.
must_use:
  - workflow.operations.live-app-store-portfolio
  - run/app-store-portfolio.json
  - operations/business-access.json
  - check-app-store-portfolio
must_catch:
  - research-backed-spec is held
  - live apps list
  - do not invent an empty portfolio
  - forbidden provider project
should_say:
  - API auth
  - Example Weather
forbidden:
  - empty portfolio authored without a live command
  - ASC is connected
  - start research anyway
