    description: Do not import Appllama's proprietary screen library. Comparable-journey research uses
      authorized evidence through the design evidence stack.
    owner: knowledge/design/mobile-flow-craft.md
    intentional: true
  - id: no-mcp-fork
    description: Provider-specific MCP commands remain upstream in appllama-usage. Do not duplicate them
      into the core runtime.
    owner: knowledge/design/mobile-flow-craft.md
    intentional: true
  - id: not-the-default-stack
    description: Framework-specific prescriptions apply only when the selected stack matches them. Expo or
      React Native is not the default by citing this pack.
