profiles:
  - id: full
    title: Full launch
    description: Every lane runs; the Deliverable Standard applies in full. The default for a complete consumer-business mandate.
    defers_lane_keys: []
  - id: essentials
    title: Essentials launch
    description: The core spine runs; the wholly-breadth lanes (paid user acquisition, the viral growth loop, lifecycle email) park as not needed until the founder widens scope. Market contact beats artifact completeness.
    defers_lane_keys:
      - paid_user_acquisition
      - growth
      - email
