schema_version: 1.0.0
id: reference.store.app-review-resubmit
title: App Review Resubmit
domain_id: domain.store
document_path: knowledge/store/app-review-resubmit.md
load_when: after bounded App Review remediation is independently verified; before any
  Apple resubmission; never from an observe-only mandate
lifecycle: active
bindings:
  workflow_ids:
    - workflow.store.app-review-resubmit
  context_pack_ids:
    - context.store
applicability_notes: Capped resubmission only. Exact standing envelope. Already-uploaded
  builds use asc review submit with --confirm. Timeout performs provider readback.
  A second rejection opens a linked cycle. Cycle exhaustion parks. Never publish.
  Never accept agreements.
