providers:
  - id: b2c/revenuecat
    version: 1.0.0
    title: RevenueCat
    description: Declared paywall, purchase, and entitlement responsibilities. Existing guidance and integrations do not yet implement the public composition execution contract.
  - id: b2c/superwall
    version: 1.0.0
    title: Superwall
    description: Declared paywall presentation responsibility alongside a purchase and entitlement owner. Public execution support is planned; experiment assignment is a separate future operation.
  - id: b2c/host-native-mobile
    version: 1.0.0
    title: Host-native mobile tools
    description: Preferred default when the current agent host already exposes native tools covering the requested target and operations. Actual availability must be checked at execution; this declaration does not probe the host or provide an execution adapter.
  - id: b2c/mobai
    version: 1.0.0
    title: MobAI
    description: Alternative mobile operation provider for an explicit binding or requirements the available native route cannot cover. Per-operation support and evidence must be verified; public execution adapter is not implemented.
  - id: b2c/consumer-business-worker
    version: 1.0.0
    title: Consumer business worker
    description: Create and independently verify existing business artifacts through a selected trusted host agent. External authority and live evidence remain separate requirements.
