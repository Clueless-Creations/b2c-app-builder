# SKOS concept scheme (YAML encoding).
# Work-vocabulary thesaurus: catalog IDs, enumerations, and kernel terms.
# Not the world ontology (catalog/ontology/). Not a second catalog.
# No broader/narrower across facets.
# Runtime agents must not query this file. check:catalog is the only reader.
schema_version: 1
id: b2c:scheme.catalog
uri: https://b2c-app-builder.dev/ns/catalog
pref_label: B2C App Builder catalog concepts
definition: Preferred labels, aliases, orthogonal facets, and homonym groups for
  catalog IDs and kernel terms. This is the map-of-the-work vocabulary, not the
  consumer-app world ontology. The catalog remains the runtime definition graph.
hidden_labels:
  - semantic similarity router
  - run attempt as work order
  - markdown context map as authority
  - second engine
  - primitives repository
  - kernel-only domain union
facets:
  - id: facet.area
    pref_label: Area
    definition: Grouping of domains for launch-matrix presentation. Not a grant axis
      and not a workstream.
  - id: facet.domain
    pref_label: Domain
    definition: Grant authority and knowledge partition. Founder grants and workflow
      ownership key off this facet.
  - id: facet.lane
    pref_label: Lane
    definition: Business-state workstream with durable status in reducer state. Orthogonal
      to domain even when English names collide.
  - id: facet.phase
    pref_label: Phase
    definition: Time order in a launch. Orthogonal to domain, lane, and area.
  - id: facet.context
    pref_label: Context pack
    definition: Specialist prompt bundle of knowledge references. Not a capability
      pack and not a knowledge package.
  - id: facet.role
    pref_label: Role
    definition: Specialist who owns a workflow node.
  - id: facet.unit
    pref_label: Business unit
    definition: Copy-layer grouping over grantable domains. Selecting a unit writes
      the same grant level to every member domain.
  - id: facet.kind
    pref_label: Catalog node kind
    definition: The ten catalog ID prefixes plus pack and profile kinds.
  - id: facet.status
    pref_label: Status
    definition: Shared run-node and lane status vocabulary.
  - id: facet.action
    pref_label: Action class
    definition: Autonomy action class on a workflow node.
  - id: facet.record
    pref_label: Operating record
    definition: Reducer-owned operating-model record kinds.
  - id: facet.kernel
    pref_label: Kernel term
    definition: Approved public vocabulary that is not a catalog node.
