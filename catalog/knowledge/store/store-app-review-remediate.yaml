schema_version: 1.0.0
id: reference.store.app-review-remediate
title: App Review Remediate
domain_id: domain.store
document_path: knowledge/store/app-review-remediate.md
load_when: after App Review observe classifies a rejection; before any consumer-repo fix,
  archive inspection, or verification recovery; never before a store submission
lifecycle: active
bindings:
  workflow_ids:
    - workflow.store.app-review-remediate
    - workflow.store.app-review-resubmit
  context_pack_ids:
    - context.store
applicability_notes: Bounded remediation only. Plan from classified kind. Park protected
  cases. Inspect a new archive for binary fixes. Bind verification to the stored
  producer. Reuse the retry opened by verifier rejection. Never submit. Never upload.
  Never accept agreements.
