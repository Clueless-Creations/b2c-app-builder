    instructions: "Audit each learning under knowledge/*/learnings/ against current repository reality and record exactly one verdict in its Refresh section: kept, updated, consolidated, replaced, or retired. Match the document to reality, never reality to the document. replaced/retired require flipping the manifest lifecycle to deprecated (replaced also names replacement_ids) — check:learning-grounding enforces the pairing, and knowledge-validation already requires a replacement target for deprecated packages. When evidence is ambiguous, keep the learning and record the doubt in the document rather than deleting on a guess. Work learning_grounding.review_overdue warnings down to zero, update the Last reviewed date on every touched document, and re-anchor citations whose files or line numbers moved."
