license:
  spdx: MIT
  status: verified
  evidence_url: https://github.com/rorkai/app-store-connect-cli-skills/blob/main/LICENSE
  evidence_sha256: 56fde5f70d5af10b746863208dee6bf0b99e49066da1f76e1800c760e276139b
