      - prepare an upgrade plan for an upstream tool we depend on
      - refresh the acknowledgments and third-party notices
    instructions: For each upstream manifest in catalog/upstreams/, run `b2c contribute upstream-check --upstream <id> --fetch --observe-host --write` to record a dated observation of the latest release, branch head, license digest, and installed executables. Classify every change since the reviewed baseline yourself; the tool's classification is a candidate for review, never a verdict. Prepare an upgrade plan with `b2c contribute upgrade-plan` and keep every intentional adaptation the manifest lists. Update baselines and the review date only after a real review of the material. Never upgrade a host binary and never repin a business as part of the check; a dependency bump activates no new effect. Regenerate credits with `npm run render:credits`, then run `check:upstreams` and `check:credits`. No scheduled check exists and CI is disabled, so this runs by hand.
