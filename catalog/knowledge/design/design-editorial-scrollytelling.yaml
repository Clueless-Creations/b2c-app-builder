applicability_notes: Use the story qualification step before selecting scrollytelling. Transfer controller, state,
  semantic, progressive-enhancement, and verification mechanics. Never transfer source identity, claims, copy, or assets.
source_exemption: Internal operating guidance. The transferable content here is scrollytelling mechanics - stable
  semantic story states, measured step-center control, shared scroll progress, responsive sticky composition, mobile
  guidance, code-native evidence visuals, a situation-to-mechanism-to-outcome-to-proof narrative, and
  progressive-enhancement verification - established by first-party audits of production implementations the maintainers
  own and operate. Those implementations are not public sources and are deliberately left uncited - the mechanics are
  the claim, and they are verified by this package's own checks rather than by an external document.
