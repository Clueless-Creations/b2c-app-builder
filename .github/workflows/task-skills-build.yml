name: Task skills final audit
# Temporary, branch-only. Removed before the candidate commit.
on:
  push:
    branches: [feat/task-skills-navigation]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Clueless-Creations/b2c-app-builder' && github.ref == 'refs/heads/feat/task-skills-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task-skills-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Keep engine entrypoint assertions at their loading boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('checks/verification/fixtures/agent-onboarding.fixtures.ts')
          t = p.read_text()
          a = t.index('    const connectAt = skill.indexOf("## Connect");')
          b = t.index('    assert(!skill.includes("Load `workflow.orchestration.full-launch-program` first")', a)
          replacement = r'''    const buildAt = skill.indexOf("## Managed business");
              const composeAt = skill.indexOf("[composition](");
              const mobileAt = skill.indexOf("[mobile app operation](");
              assert(buildAt >= 0 && composeAt > buildAt, "skill teaches composition before the ordinary business path");
              assert(mobileAt > composeAt, "mobile capture precedes composition customization");
              assert(!/docs\/north-star-architecture|ARCH-\d+|docs\/architecture-conformance/.test(skill), "business skill requires maintainer architecture");
              const setupPath = "agents/skills/b2c-app-builder/references/setup.md";
              const lifecyclePath = "agents/skills/b2c-app-builder/references/business-lifecycle.md";
              assert(skill.includes(`](${setupPath})`) && skill.includes(`](${lifecyclePath})`), "skill lost a direct procedure route");
              const connect = readFileSync(path.join(skillRoot, setupPath), "utf8");
              assert(!/b2c_catalog|b2c_knowledge_search/.test(connect), "Connect still presents catalog/search as the start path");
              const build = readFileSync(path.join(skillRoot, lifecyclePath), "utf8");
              const createAt = build.indexOf("business-create");
              const statusCommandAt = build.indexOf("business-status");
              const planCommandAt = build.indexOf("business-plan");
              assert(createAt >= 0 && statusCommandAt > createAt && planCommandAt > statusCommandAt, "skill still resumes with plan and skips status");
              const statusAt = build.indexOf("b2c_business_status");
              const catalogAt = build.indexOf("only for a specific goal");
              assert(statusAt >= 0 && catalogAt > statusAt, "skill still sends a registered business through catalog before status/plan");
              assert(Buffer.byteLength(skill, "utf8") <= 6500, "root activation exceeded its context budget");
          '''
          p.write_text(t[:a] + replacement + t[b:])
          p = Path('skill-version.json')
          data = json.loads(p.read_text())
          data['releaseNotes'][-1] = 'Verify public and engine startup routes through conditional procedures without loading them for unrelated tasks.'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          npx prettier --write checks/verification/fixtures/agent-onboarding.fixtures.ts
          npm run render:all
          npm run render:evidence-schema-version
          npm run test:fixtures -- agent-onboarding
          npm run check:task-skills
      - name: Commit the clean candidate to this branch only
        id: candidate
        run: |
          test "$(git branch --show-current)" = feat/task-skills-navigation
          rm .github/workflows/task-skills-build.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify engine startup through conditional skill procedures'
          git push origin HEAD:refs/heads/feat/task-skills-navigation
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Candidate commit: $(git rev-parse HEAD)"
          echo "Candidate tree: $(git rev-parse HEAD^{tree})"
          git bundle create /tmp/task-skills-verified.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: task-skills-verified-source
          path: /tmp/task-skills-verified.bundle
          retention-days: 1
  audit:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            args: --lane fast
          - name: heavy-1
            args: --lane heavy --shard 1/2
          - name: heavy-2
            args: --lane heavy --shard 2/2
    name: Full audit (${{ matrix.name }})
    env:
      B2C_REQUIRE_GIT_HISTORY: '1'
      GITHUB_BASE_SHA: a102c8c6e6c20400686af375b11ba5957413513d
      B2C_FIXTURE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node entrypoints/cli/b2c.mjs --help
      - run: npm run audit:ci -- ${{ matrix.args }}
  hosted:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix hosted/knowledge-mcp
      - run: npm run hosted:check
  app:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix hosted/builder-console
      - run: npm run app:check
  complete:
    if: always()
    needs: [integrate, audit, hosted, app]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected suite
        env:
          INTEGRATE: ${{ needs.integrate.result }}
          AUDIT: ${{ needs.audit.result }}
          HOSTED: ${{ needs.hosted.result }}
          APP: ${{ needs.app.result }}
          CANDIDATE: ${{ needs.integrate.outputs.sha }}
        run: |
          test "$INTEGRATE" = success
          test "$AUDIT" = success
          test "$HOSTED" = success
          test "$APP" = success
          echo "Full verification passed for $CANDIDATE"
