name: Reviewed maintenance verification
on:
  push:
    branches: [agent/session-397-verification-20260913]
    paths: [.github/workflows/session-verify-ready.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      B2C_REQUIRE_GIT_HISTORY: '1'
      GITHUB_BASE_SHA: e290c4e3316c897696a259a212d64fafacc9a0e3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c06cea6f6ffa7bf99855721960b2eed817036094
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: git rev-parse HEAD && npm run audit:ci -- --lane presubmit
      - name: Verify actual affected fixture shards
        shell: bash
        run: |
          set -euo pipefail
          for shard in core-artifacts evidence-schema engineering; do
            npm run test:validators -- --shard "$shard" > "$RUNNER_TEMP/$shard.log" 2>&1
            SHARD="$shard" node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const marker = 'B2C_SHARD_RESULTS_V1:';
          const line = fs.readFileSync(`${process.env.RUNNER_TEMP}/${process.env.SHARD}.log`, 'utf8').split('\n').find(line => line.startsWith(marker));
          if (!line) throw new Error('Missing fixture results');
          const rows = JSON.parse(line.slice(marker.length));
          console.log(`${process.env.SHARD}: ${rows.filter(row => row.ok).length}/${rows.length} passed`);
          if (!rows.length || rows.some(row => !row.ok)) { console.error(rows.filter(row => !row.ok)); throw new Error('Fixture failure'); }
          JS
          done
      - run: npm run render:all && npm run check:evidence-schema-drift && git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-research-fixtures
          path: ${{ runner.temp }}/*.log
          retention-days: 3
  prepare-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 99c549ae067cab0be0db0ef5f294b766a2519586
          fetch-depth: 0
      - name: Combine reviewed source, allowing only generated package conflicts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin agent/405-final-source; then exit 1; fi
          git switch -c agent/405-final-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff c06cea6f6ffa7bf99855721960b2eed817036094; then
            test -f .git/MERGE_HEAD
            conflicts=$(git diff --name-only --diff-filter=U)
            test -n "$conflicts"
            while IFS= read -r file; do
              case "$file" in
                catalog/generated/firstparty-pin.json|catalog/generated/firstparty/snapshot.json) ;;
                *) echo "Refusing unexpected authored conflict: $file" >&2; exit 1 ;;
              esac
            done <<< "$conflicts"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Resolve generated conflicts only through owning renderers
        run: npm run render:all && npm run check:evidence-schema-drift && npm run typecheck
      - id: commit
        name: Commit integration without auxiliary workflow files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .maintenance
          test ! -e .github/workflows/session-verify-ready.yml
          git add --update
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'Merge reviewed research fixes and regenerate the schedule package projections'
          git push origin HEAD:refs/heads/agent/405-final-source
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  integration:
    needs: prepare-schedule
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [presubmit, fast, heavy-1, heavy-2, hosted, app]
    env:
      B2C_REQUIRE_GIT_HISTORY: '1'
      GITHUB_BASE_SHA: e290c4e3316c897696a259a212d64fafacc9a0e3
      B2C_FIXTURE_CONCURRENCY: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-schedule.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run complete integration lane
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          case "$LANE" in
            presubmit)
              npm run audit:ci -- --lane presubmit
              npm run test:fixtures -- adapters
              npm run render:all
              npm run check:evidence-schema-drift
              git diff --exit-code ;;
            fast) npm run audit:ci -- --lane fast ;;
            heavy-1) npm run audit:ci -- --lane heavy --shard 1/2 ;;
            heavy-2) npm run audit:ci -- --lane heavy --shard 2/2 ;;
            hosted) npm ci --prefix hosted/knowledge-mcp && npm run hosted:check ;;
            app) npm ci --prefix hosted/builder-console && npm run app:check ;;
          esac
