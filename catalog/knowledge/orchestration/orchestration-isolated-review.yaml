schema_version: 1.0.0
id: reference.orchestration.isolated-review
title: Isolated Review
domain_id: domain.orchestration
document_path: knowledge/orchestration/isolated-review.md
load_when: before dispatching any producer whose surface a second agent must accept, before dispatching an auditor
  node, when writing or checking the review ledger in operations/ORCHESTRATION.md, and when a review, rubric, or fix
  loop is contested
lifecycle: active
bindings:
  workflow_ids:
    - workflow.orchestration.full-launch-program
    - workflow.orchestration.full-launch-closeout
    - workflow.research.spec-red-team-audit
    - workflow.design.reference-pack-librarian
    - workflow.design.design-system-audit
    - workflow.growth.landing-funnel-audit
    - workflow.words.copy-review-audit
    - workflow.experience.emotional-design-audit-auditor
    - workflow.experience.onboarding-system.onb-20-adversarial-qa
    - workflow.engineering.engineering-orchestration-ce-production-readiness
  context_pack_ids:
    - context.orchestration
applicability_notes: The producer never accepts its own surface. Auditor nodes write findings only. Every producer-to-auditor
  pair is a review-ledger row that check:orchestration verifies. Runtime isolation (separate subagent or workflow step
  with read-only tools) is the dispatcher's job; record used:false with a reason when the runtime cannot isolate.
