title: Age Rating Questionnaire
domain_id: domain.store
document_path: knowledge/store/age-rating-questionnaire.md
load_when: before Apple review submission; when STORE_CONSOLE.md needs social, chat, age-assurance,
  and UGC age-rating answers with product evidence
lifecycle: active
bindings:
  workflow_ids:
    - workflow.store.store-console-workflow
    - workflow.store.asc-cli-automation
    - workflow.store.apple-signing-and-release-readiness
