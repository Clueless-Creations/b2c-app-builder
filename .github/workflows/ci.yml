name: CI

# Ordinary pull requests and pushes to main run PRESUBMIT: a measured cheap
# set plus extra safety jobs when the change actually reaches those trees.
# Full verification (historical fast pool + heavy shards + hosted + app) is
# explicit: workflow_dispatch with verification=full (the dispatch default).
# A presubmit pass is not a full-audit pass. Suites are deferred, not deleted.
#
# Do not add top-level on.pull_request.paths — a skipped required workflow stays
# pending. Job-level `if:` plus the aggregator keeps merge-gate semantics honest.
# publish.yml is a separate workflow with cancel-in-progress: false; do not
# share this concurrency group with it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification:
        description: "presubmit for the ordinary path, or full for checkpoint / final verification"
        type: choice
        default: full
        options:
          - presubmit
          - full

concurrency:
  # Ordinary runs share one group per PR number or branch so a new push cancels
  # the run it replaces, including ordinary main commits. Explicit full runs use
  # a different group so an ordinary push cannot cancel checkpoint verification.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.verification == 'full' && 'full' || 'ordinary' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.verification != 'full' }}

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verification: ${{ steps.lane.outputs.verification }}
      heavy: ${{ steps.lane.outputs.heavy }}
      hosted: ${{ steps.lane.outputs.hosted }}
      app: ${{ steps.lane.outputs.app }}
      scopes: ${{ steps.lane.outputs.scopes }}
      expand: ${{ steps.lane.outputs.expand }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.verification || 'presubmit' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tooling/ci-lane.mjs

  presubmit:
    name: Presubmit
    runs-on: ubuntu-latest
    needs: [scope]
    # Skip when an explicit full run already covers this set via Audit (fast).
    # If Scope failed, still run the cheap set (fail closed).
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.verification != 'full') }}
    timeout-minutes: 15
    env:
      B2C_REQUIRE_GIT_HISTORY: "1"
      B2C_AUDIT_SCOPES: ${{ needs.scope.outputs.scopes }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch merge-base history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/${BASE_REF}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/knowledge-mcp/package-lock.json
            hosted/builder-console/package-lock.json

      - run: npm ci

      # Entrypoint smoke: the CLI dispatcher boots. Not a second doctor.
      - run: node entrypoints/cli/b2c.mjs --help

      # Must run from the repo root (the package root since ADR-0002) — the
      # .git/.github markers there are what make detectLayout() pick "repo".
      # --lane presubmit is the measured allow-list, not a rename of --lane fast.
      - run: npm run audit:ci -- --lane presubmit

  audit-fast:
    name: Audit (fast)
    runs-on: ubuntu-latest
    needs: [scope]
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.verification == 'full') }}
    timeout-minutes: 20
    env:
      B2C_REQUIRE_GIT_HISTORY: "1"
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch merge-base history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/${BASE_REF}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/knowledge-mcp/package-lock.json
            hosted/builder-console/package-lock.json

      - run: npm ci

      # Historical cheap pool: every non-serial audit step. Full verification
      # still runs this. --ci skips only the maintainer-only validate:skill step.
      - run: npm run audit:ci -- --lane fast

  audit-heavy:
    name: Audit (heavy ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [scope]
    # Full verification, or Scope failure (cannot safely defer). Ordinary PRs
    # defer this job even when paths would have selected it.
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.verification == 'full') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      B2C_FIXTURE_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/knowledge-mcp/package-lock.json
            hosted/builder-console/package-lock.json

      - run: npm ci

      - run: npm run audit:ci -- --lane heavy --shard ${{ matrix.shard }}

  hosted-check:
    name: Hosted worker check
    runs-on: ubuntu-latest
    needs: [scope]
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.verification == 'full' || needs.scope.outputs.hosted == 'true') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/knowledge-mcp/package-lock.json
            hosted/builder-console/package-lock.json

      - run: npm ci
      # hosted/knowledge-mcp/worker.ts imports kernel/knowledge-service/
      # modules that resolve node_modules starting at the repository root,
      # not hosted/knowledge-mcp — skipping either install above turns a
      # missing dependency into a misleading typecheck error.
      - run: npm ci --prefix hosted/knowledge-mcp

      - run: npm run hosted:check

  app-check:
    name: App check
    runs-on: ubuntu-latest
    needs: [scope]
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.verification == 'full' || needs.scope.outputs.app == 'true') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/knowledge-mcp/package-lock.json
            hosted/builder-console/package-lock.json

      - run: npm ci
      - run: npm ci --prefix hosted/builder-console

      - run: npm run app:check

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: always()
    needs: [scope, presubmit, audit-fast, audit-heavy, hosted-check, app-check]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate selected, deferred, failed, and cancelled jobs
        env:
          JOB_PRESUBMIT: ${{ needs.presubmit.result }}
          JOB_AUDIT_FAST: ${{ needs.audit-fast.result }}
          JOB_AUDIT_HEAVY: ${{ needs.audit-heavy.result }}
          JOB_HOSTED: ${{ needs.hosted-check.result }}
          JOB_APP: ${{ needs.app-check.result }}
          VERIFICATION: ${{ needs.scope.outputs.verification }}
          HOSTED: ${{ needs.scope.outputs.hosted }}
          APP: ${{ needs.scope.outputs.app }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: node tooling/ci-aggregate.mjs
