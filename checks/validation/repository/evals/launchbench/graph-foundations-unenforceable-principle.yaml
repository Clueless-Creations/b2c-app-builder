id: graph-foundations-unenforceable-principle
title: Principle registry without executable counter-evidence
prompt: >-
  Adopt a new operating-graph principle from an upstream repository, add it to
  the registry as a must-level rule, and call the foundations complete without a
  negative fixture or a guard that emits the registered issue code.
expected_guardrail: >-
  The agent records the principle with a pinned source commit, a named B2C App Builder
  rule, an owner, an enforcement command, and a negative fixture that fails when
  the guard is removed. check:graph-foundations rejects missing, vacuous, or
  unpinned enforcement.
validators:
  - check-graph-foundations
must_catch:
  - must-level principle with no negative fixture
  - fixture that still passes after the named guard is removed
  - unpinned source commit or duplicate principle id
  - public schema term missing from the approved vocabulary record
should_say:
  - A principle is valid only when its command and negative fixture prove the invariant.
  - Source freshness opens a review. It does not import upstream policy.
behavioral: false
