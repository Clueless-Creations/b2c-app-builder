schema_version: 1
meta:
  version: alpha
  name: App Name
  slug: app-name
  description: "{{IDEA_DESCRIPTION}}"
  status: hypothesis
copy:
  intro: |
    This file is generated from `product.yaml`. Edit `product.yaml`, then render
    `PRODUCT.md`. Keep evidence in `strategy/RESEARCH.md` and design decisions in
    `DESIGN.md`.
  promise_user_problem: |
    - Idea hypothesis: {{IDEA_HYPOTHESIS}}
    - Promise: Not accepted.
    - Primary user: Not accepted.
    - Problem: Not accepted.
  evidence_and_category: |
    Research the category, demand, alternatives, reachable distribution, and risks in
    `strategy/RESEARCH.md`. Treat the idea as a hypothesis until the evidence supports it.
  core_loop: |
    Define the repeated action, the useful result, and the shortest path to that result.
  complete_scope: |
    - Include: Not accepted.
    - Required systems and acceptance: Not accepted.
    - Exclusions with rationale: Not accepted.
    - Non-goals: Not accepted.
  requirements: |
    Add requirements only after the product direction survives research. State each
    requirement as a user outcome with an observable acceptance condition.
  journey: |
    Use `DESIGN.md` for the experience and design system. Create detailed journey,
    copy, analytics, engineering, revenue, store, and trust files only when the work
    needs them.
  metrics: |
    Define activation, retention, conversion, and monetization after the core loop is
    accepted. Do not select prices or providers by default.
  risks: |
    Record the largest evidence, desirability, feasibility, distribution, safety, and
    business risks. Name the evidence that can resolve each risk.
  decision_log: |
    | Date | Decision | Evidence | Status |
    | --- | --- | --- | --- |
    | Not recorded | Initial direction needs research. | `strategy/RESEARCH.md` | Open |
  ownership: |
    `product.yaml` owns product meaning. `PRODUCT.md` is its rendered index.
    `strategy/RESEARCH.md` owns evidence. `DESIGN.md` owns design. Use `b2c status`
    and `b2c plan` for execution state. Git owns revisions.
instances:
  - id: app.primary
    class_id: class.app
    slots:
      slot.app.promise: promise.primary
      slot.app.core-loop: core-loop.primary
      slot.app.features:
        - feature.scope-placeholder
  - id: customer.primary
    class_id: class.customer
    slots:
      slot.customer.problem: problem.primary
  - id: problem.primary
    class_id: class.problem
    slots: {}
  - id: promise.primary
    class_id: class.promise
    slots: {}
  - id: core-loop.primary
    class_id: class.core-loop
    slots: {}
  - id: feature.scope-placeholder
    class_id: class.feature
    slots:
      slot.feature.scope: required
  - id: hypothesis.idea
    class_id: class.hypothesis
    slots:
      slot.hypothesis.about: app.primary
  - id: evidence.research
    class_id: class.evidence
    slots:
      slot.evidence.about: app.primary
  - id: decision.initial
    class_id: class.decision
    slots:
      slot.decision.about: app.primary
      slot.decision.evidence:
        - evidence.research
