schema_version: 1.0.0
id: reference.design.design-worthiness
title: Design Worthiness
domain_id: domain.design
document_path: knowledge/design/design-worthiness.md
load_when: when DESIGN.md authoring or its generated Design Room review needs the mechanical worthiness floor or its independent audit
  must record the delegated taste decision before engineering harden, including native flow semantics and
  mechanical anti-generic consistency, with no beauty score
lifecycle: active
bindings:
  workflow_ids:
    - workflow.research.research-backed-spec
    - workflow.design.design-room
    - workflow.growth.pre-launch-funnel-landing-waitlist
    - workflow.design.design-system-audit
    - workflow.experience.onboarding-system.onb-17-screen-control-paywall-contract
    - workflow.experience.onboarding-system.onb-18-visual-design-prototype
  context_pack_ids:
    - context.design
    - context.experience
applicability_notes: Orchestrate holes only. Do not rewrite eleven-star, emotional design, quality-lens,
  vibecoded-tells, motion recipes, or mobile-flow-craft. DESIGN.md stays producer-owned. Mechanical, attested,
  and independently bound taste tiers decide what an agent may assert; runtime proof remains design-acceptance's job.
sources:
  - id: w3c-wcag22-text-contrast
    name: W3C WCAG 2.2 text contrast
    source_type: standard
    url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
    review_cadence_days: 180
    claim_scope: Text contrast thresholds and exceptions; no universal7:1 rule.
    last_review_date: "2026-09-07"
    reviewer: b2c-maintainers
  - id: w3c-wcag22-non-text-contrast
    name: W3C WCAG 2.2 non-text contrast
    source_type: standard
    url: https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html
    review_cadence_days: 180
    claim_scope: Essential graphical object and control contrast with applicable exceptions.
    last_review_date: "2026-09-07"
    reviewer: b2c-maintainers
