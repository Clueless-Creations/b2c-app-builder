    instructions: "After any meaningful skill-behavior edit, bump skill-version.json and write matching release notes in the same change — check:version-discipline fails a change that edits behavior without moving the version alongside it. On a founder-approved sync, run `npm run runtime:sync -- --all-clients` from the source checkout (never raw rsync): the tool computes an ownership-tracked plan from git-tracked source files against the installed runtime's manifest, refuses to clobber runtime files edited since the last sync (surface those as conflicts and commit them to source instead), preserves unowned files, deletes only files a previous sync wrote, then writes each present unique client root, runs npm install (when dependencies changed) and npm run audit inside the runtime, reports the ~/.claude and ~/.agents alias symlinks, and fails if any present client pin still trails. Use `npm run runtime:check` to inspect drift without writing. check:skill-version --all-runtimes must report installed == source afterward, and no present Claude/Cursor/Codex/Agents client may trail the pin."
