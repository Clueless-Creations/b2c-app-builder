  - id: workflow.store.app-review-observe
    title: App Review observe
    domain_id: domain.store
    area_ids:
      - area.build-release
    trigger: When an App Store version is in review, or after a status change, before any remediation or resubmission
    founder_phrasings:
      - check the status of our app store review
      - watch for a decision on our submitted build
      - is our app still in review
    instructions: "Run an observe-only App Review watch for one exact app version. Probe public API commands and a separate web-session receipt (`asc web auth status`, `asc web review list`, `asc web review show`). Poll the three Apple layers, persist every raw value, and store unknown states as unknown_provider_state. A signed Apple webhook is a wake-up only: verify `x-apple-signature` HMAC-SHA256 on the raw body, persist a host-neutral envelope, then drain that queue with `b2c app-review-ingress consume` so poll writes `run/app-review.json`. Consume polls App Store Connect through the live `asc` provider. Archive each accepted envelope after the watch write. Keep `--provider-fixture` test-only. Deduplicate by Apple event ID, including archived IDs, during persist. Do not copy webhook oldValue or newValue into layer truth. When the listing has no match, clear stored registration. Ignore Apple deliveries that predate the mandate start. Fail closed when `asc review status` JSON has no valid app-version layer. Order live snapshots by poll time, not createdDate or submittedDate. If `asc web agreements status` fails, keep the public review snapshot and treat a missing web session as a founder handoff. When review issues appear, probe web-session readiness, retrieve `asc web review show` for the exact submission ID, quarantine reviewer content as fingerprints, and classify without implementing a fix. Write durable state to run/app-review.json. Project the current blocker and case surface into store/APP_REVIEW.md in founder language. Classify a pending Apple agreement as founder action required. Never call `asc web agreements accept`. Never run `asc webhooks serve` as production ingress. Never submit, upload, or mutate store material. Pass `npm run check:app-review-contract -- --root .`."
    reads:
      - store/STORE_CONSOLE.md
      - state/business-state.json
    consults: []
    reference_ids:
      - reference.store.app-review-observe
      - reference.store.app-store-connect-cli
      - reference.store.aso-store-ops
    role_id: role.engineering-leader
    lane_ids:
      - store_console
    phase_ids:
      - phase.3
    dependencies:
      - workflow.store.asc-cli-automation
      - workflow.operations.agent-operations-ledger
    output_paths:
      - store/APP_REVIEW.md
      - run/app-review.json
    gate_commands:
      - check:app-review-contract
    provider_ids:
      - provider.app-store-connect
    founder_only_actions:
      - accept Apple agreements
    action_class: observe
    idempotent: true
    applicability:
      mode: always
  - id: workflow.store.app-review-remediate
    title: App Review remediate
    domain_id: domain.store
    area_ids:
