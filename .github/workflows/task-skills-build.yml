name: Task skill integration inputs (temporary)

# Read-only branch tooling. Removed before merge; no deployment or release.
on:
  push:
    branches: [feat/task-skills-navigation]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Clueless-Creations/b2c-app-builder' && github.ref == 'refs/heads/feat/task-skills-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix hosted/knowledge-mcp
      - run: npm ci --prefix hosted/builder-console
      - name: Public source and dependency snapshot
        run: |
          mkdir -p /tmp/task-skill-inputs
          git bundle create /tmp/task-skill-inputs/source.bundle --all
          tar -czf /tmp/task-skill-inputs/dependencies.tgz node_modules hosted/knowledge-mcp/node_modules hosted/builder-console/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: task-skill-integration-inputs
          path: /tmp/task-skill-inputs
          retention-days: 1
