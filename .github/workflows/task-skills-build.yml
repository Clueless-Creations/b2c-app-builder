name: Task skill projections (temporary branch integration)

# Branch-only support, removed before merge. No deployment or release actions.
on:
  push:
    branches: [feat/task-skills-navigation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task-skills-branch-integration
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'Clueless-Creations/b2c-app-builder' && github.ref == 'refs/heads/feat/task-skills-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task-skills-navigation
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Capture public source and installed toolchain only
        run: |
          mkdir -p "$RUNNER_TEMP/task-skill-checkout"
          git bundle create "$RUNNER_TEMP/task-skill-checkout/source.bundle" HEAD refs/heads/feat/task-skills-navigation refs/remotes/origin/main
          tar -czf "$RUNNER_TEMP/task-skill-checkout/dependencies.tgz" node_modules
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          tar -czf "$RUNNER_TEMP/task-skill-checkout/node-toolchain.tgz" -C "$NODE_ROOT" bin lib/node_modules/npm
      - uses: actions/upload-artifact@v4
        with:
          name: task-skill-checkout
          path: ${{ runner.temp }}/task-skill-checkout
          retention-days: 1
          compression-level: 0
