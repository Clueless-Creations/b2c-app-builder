evaluations:
  - id: brand-drift-counterexample
    unit_id: amir-brand-system
    kind: counterexample
    description: Distinguish permitted scene variation from identity and claim drift.
    must_fail:
      - A campaign keeps the logo but replaces the approved type roles and adds an unsupported certification.
    must_pass:
      - A new setting preserves the accepted identity and claim evidence.
  - id: cinematic-applicability-counterexample
    unit_id: amir-cinematic-scroll
    kind: counterexample
    description: Select depth by communication need and retain complete semantic fallback.
    must_fail:
      - A fixed portal scroll hides the price and has no usable reduced-motion reading sequence.
    must_pass:
      - A quiet static utility rejects cinematic treatment with a task-based reason.
      - A selected layered story keeps anchors, real text and correct forward/reverse states.
