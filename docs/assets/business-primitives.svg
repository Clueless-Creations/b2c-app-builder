<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Sheet 1. The kitchen layout for a consumer-app business.</title>
<desc id="desc">A drawing sheet. A kitchen drawn in plan with six numbered stations. The office and upkeep sit at the left. Prep &amp; design and the hot line fill the middle. The pass stands between the hot line and front of house, with a mandate hanging on it and the chef beside it. Front of house opens through a door on the right to the business, drawn as a phone and a web page. Blue arrows carry tickets from the pass into Prep &amp; design, down to the hot line, back to the pass, and out through front of house to the door. A dashed inspection line returns evidence from the business to the pass. Below, section A-A shows the shared foundation in hatched section: capabilities, providers, recipes, knowledge, evidence. A title block records the project, sheet number, license, and that the drawing is made by the agent and checked by evidence.</desc>
<style>
/* font-rationale: docs/assets/README.md, Identity derivation. Engineering lettering for annotation, a title-block serif for the sheet title. */
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.ink{fill:#1a1d21}.muted{fill:#5b5f66}.blue{fill:#2b55a3}.red{fill:#b83a2a}
.frame{fill:none;stroke:#c3bcae}
.wall{fill:none;stroke:#2b55a3;stroke-width:1.5}
.part{fill:none;stroke:#2b55a3;stroke-width:0.9}
.open{fill:none;stroke:#2b55a3;stroke-width:0.9;stroke-dasharray:4 3}
.obj{fill:#f3efe6;stroke:#2b55a3;stroke-width:0.9}
.flow{fill:none;stroke:#2b55a3;stroke-width:1.25}
.ret{fill:none;stroke:#b83a2a;stroke-width:1.25;stroke-dasharray:5 3}
.callout{fill:#f3efe6;stroke:#2b55a3;stroke-width:1.25}
.plate{fill:#f3efe6}
</style>
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#2b55a3" stroke-opacity="0.35" stroke-width="1"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#2b55a3" stroke-opacity="0.16" stroke-width="1"/></pattern>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b55a3"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b83a2a"/></marker>
</defs>
<rect width="1000" height="600" fill="#f3efe6"/>
<rect x="20" y="20" width="960" height="560" class="frame" stroke-width="1"/>
<rect x="28" y="28" width="944" height="544" class="frame" stroke-width="0.6"/>

<text x="48" y="56" class="mono ink" font-size="10" letter-spacing="0.8">B2C APP BUILDER · SHEET 1 OF 3 · THE KITCHEN LAYOUT</text>
<text x="48" y="90" class="serif ink" font-size="27">Build the business around the app.</text>
<text x="48" y="112" class="mono muted" font-size="11.5">Six stations and a pass. You run service. Your agents cook.</text>

<!-- upkeep is hatched: the contributors' room -->
<rect x="60" y="246" width="130" height="150" fill="url(#hatch2)"/>

<!-- walls, with the door gap on the right -->
<path d="M60 136H900V246M900 286V396H60V136" class="wall"/>
<path d="M190 136V396" class="part"/>
<path d="M60 246H190" class="part"/>
<path d="M596 136V396" class="part"/>
<path d="M680 136V396" class="part"/>
<path d="M190 296H596" class="open"/>

<!-- 5 the office -->
<circle cx="78" cy="154" r="11" class="callout"/><text x="78" y="158" class="mono blue" font-size="10.5" font-weight="600" text-anchor="middle">5</text>
<text x="94" y="158" class="mono ink" font-size="11.5">THE OFFICE</text>
<text x="72" y="176" class="mono muted" font-size="9">Accounts, privacy,</text>
