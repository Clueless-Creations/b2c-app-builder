<circle cx="614" cy="154" r="11" class="callout"/><text x="614" y="158" class="mono blue" font-size="10.5" font-weight="600" text-anchor="middle">1</text>
<text x="604" y="180" class="mono ink" font-size="11.5">THE PASS</text>
<text x="604" y="194" class="mono muted" font-size="9">Tickets in,</text>
<text x="604" y="206" class="mono muted" font-size="9">plates out</text>
