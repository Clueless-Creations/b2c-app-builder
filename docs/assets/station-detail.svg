<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Sheet 3. One station in detail.</title>
<desc id="desc">A drawing sheet showing one station in detail. A work order ticket at the left carries the service, b2c/subscription-app 1.0.0, and the target, iOS on SwiftUI. A blue arrow takes it to a counter labeled station, front of house, the register, which belongs to the capability b2c/monetization. On the counter sits the operation b2c/monetization.present-paywall. Below the counter a bound provider, b2c/revenuecat 1.0.0 with connection paywalls, sits beside a dashed box for another purveyor that would keep the same operation and the same meaning. A hatched walk-in below the counter, labeled knowledge, feeds the station with bounded mise en place. At the right the counter hands off to an evidence box holding a claim, an artifact, and an environment. A dashed inspection line returns from the evidence box to the ticket, labeled accepted, or the work stays pending. A title block records the project, sheet number, and license.</desc>
<style>
/* font-rationale: docs/assets/README.md, Identity derivation. Engineering lettering for annotation, a title-block serif for the sheet title. */
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.ink{fill:#1a1d21}.muted{fill:#5b5f66}.blue{fill:#2b55a3}.red{fill:#b83a2a}
.frame{fill:none;stroke:#c3bcae}
.obj{fill:#f3efe6;stroke:#2b55a3;stroke-width:1.25}
.open{fill:none;stroke:#2b55a3;stroke-width:0.9;stroke-dasharray:4 3}
.flow{fill:none;stroke:#2b55a3;stroke-width:1.25}
.ret{fill:none;stroke:#b83a2a;stroke-width:1.25;stroke-dasharray:5 3}
</style>
<defs>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#2b55a3" stroke-opacity="0.16" stroke-width="1"/></pattern>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b55a3"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b83a2a"/></marker>
</defs>
<rect width="1000" height="460" fill="#f3efe6"/>
<rect x="20" y="20" width="960" height="420" class="frame" stroke-width="1"/>
<rect x="28" y="28" width="944" height="404" class="frame" stroke-width="0.6"/>

<text x="48" y="56" class="mono ink" font-size="10" letter-spacing="0.8">B2C APP BUILDER · SHEET 3 OF 3 · DETAIL A · ONE STATION</text>
<text x="48" y="88" class="serif ink" font-size="24">One station, drawn in detail.</text>
<text x="48" y="108" class="mono muted" font-size="11">The composition from the README, drawn as the register at front of house. Swap the purveyor and the plate keeps its meaning.</text>

<!-- the work order ticket -->
<rect x="60" y="150" width="32" height="40" class="flow"/>
<path d="M67 162H85M67 170H85M67 178H79" stroke="#5b5f66" stroke-width="1" fill="none"/>
<text x="76" y="206" class="mono muted" font-size="9.5" text-anchor="middle">WORK ORDER</text>
<text x="48" y="224" class="mono muted" font-size="8.5">service · b2c/subscription-app 1.0.0</text>
<text x="48" y="238" class="mono muted" font-size="8.5">target · ios / swiftui</text>
<path d="M96 186H236" class="flow" marker-end="url(#fa)"/>
<text x="166" y="180" class="mono blue" font-size="8.5" text-anchor="middle">TICKET</text>

<!-- the station counter -->
<rect x="240" y="176" width="520" height="70" class="obj"/>
<text x="250" y="192" class="mono ink" font-size="9.5">STATION · FRONT OF HOUSE · THE REGISTER</text>
<text x="750" y="192" class="mono muted" font-size="9.5" text-anchor="end">CAPABILITY · b2c/monetization</text>
<rect x="360" y="202" width="280" height="34" class="obj"/>
<text x="500" y="214" class="mono muted" font-size="7.5" letter-spacing="0.8" text-anchor="middle">OPERATION</text>
<text x="500" y="229" class="mono ink" font-size="10.5" text-anchor="middle">b2c/monetization.present-paywall</text>

<!-- the purveyor, bound and swappable -->
<path d="M455 236V286" class="flow" marker-end="url(#fa)"/>
<text x="462" y="266" class="mono blue" font-size="8">BOUND</text>
<rect x="380" y="290" width="150" height="46" class="obj"/>
<text x="455" y="303" class="mono muted" font-size="7.5" letter-spacing="0.8" text-anchor="middle">PROVIDER</text>
<text x="455" y="319" class="mono ink" font-size="10" text-anchor="middle">b2c/revenuecat 1.0.0</text>
<text x="455" y="331" class="mono muted" font-size="8.5" text-anchor="middle">connection:paywalls</text>
<path d="M530 313H566" class="open"/>
<text x="548" y="308" class="mono muted" font-size="7.5" text-anchor="middle">SWAP</text>
<rect x="570" y="290" width="150" height="46" class="open"/>
<text x="645" y="303" class="mono muted" font-size="7.5" letter-spacing="0.8" text-anchor="middle">ANOTHER PURVEYOR</text>
<text x="645" y="319" class="mono ink" font-size="9.5" text-anchor="middle">same operation,</text>
<text x="645" y="331" class="mono ink" font-size="9.5" text-anchor="middle">same meaning</text>
<text x="240" y="364" class="mono muted" font-size="9">Acceptance criteria come from the capability, not the purveyor.</text>

<!-- the walk-in: knowledge, behind the line -->
<path d="M310 288V250" class="flow" marker-end="url(#fa)"/>
<text x="318" y="270" class="mono blue" font-size="8">MISE EN PLACE</text>
<rect x="250" y="290" width="120" height="46" fill="url(#hatch2)" stroke="#2b55a3" stroke-width="1.25"/>
<text x="310" y="303" class="mono muted" font-size="7.5" letter-spacing="0.8" text-anchor="middle">KNOWLEDGE</text>
<text x="310" y="319" class="mono ink" font-size="9.5" text-anchor="middle">the walk-in</text>
<text x="310" y="331" class="mono muted" font-size="8.5" text-anchor="middle">bounded, per ticket</text>

<!-- the plate check: evidence -->
<path d="M760 211H796" class="flow" marker-end="url(#fa)"/>
<rect x="800" y="190" width="150" height="48" class="obj"/>
<text x="875" y="204" class="mono muted" font-size="7.5" letter-spacing="0.8" text-anchor="middle">EVIDENCE</text>
<text x="875" y="218" class="mono ink" font-size="9" text-anchor="middle">claim, artifact,</text>
<text x="875" y="231" class="mono ink" font-size="9" text-anchor="middle">environment</text>
<path d="M875 190V144H76V146" class="ret" marker-end="url(#fr)"/>
<text x="480" y="140" class="mono red" font-size="9" text-anchor="middle">ACCEPTED, OR THE WORK STAYS PENDING</text>

<!-- notes -->
<text x="48" y="398" class="mono muted" font-size="9.5">Every binding in b2c.yaml is one station detail like this one.</text>
<text x="48" y="416" class="mono muted" font-size="9.5">Sheet 1 draws the whole kitchen. Sheet 2 draws the internal layers.</text>

<!-- title block -->
<rect x="652" y="368" width="320" height="64" class="frame" stroke-width="1" fill="#f3efe6"/>
<path d="M812 368V432M892 368V432M652 400H972" class="frame" stroke-width="0.8"/>
<text x="658" y="380" class="mono muted" font-size="7.5" letter-spacing="0.8">PROJECT</text>
<text x="658" y="394" class="mono ink" font-size="10">One consumer-app business</text>
<text x="818" y="380" class="mono muted" font-size="7.5" letter-spacing="0.8">SHEET</text>
<text x="818" y="394" class="mono ink" font-size="10">3 of 3</text>
<text x="898" y="380" class="mono muted" font-size="7.5" letter-spacing="0.8">LICENSE</text>
<text x="898" y="394" class="mono ink" font-size="10">MIT</text>
<text x="658" y="412" class="mono muted" font-size="7.5" letter-spacing="0.8">DRAWN BY</text>
<text x="658" y="426" class="mono ink" font-size="10">Your AI agent</text>
<text x="818" y="412" class="mono muted" font-size="7.5" letter-spacing="0.8">CHECKED BY</text>
<text x="818" y="426" class="mono ink" font-size="10">Evidence</text>
<text x="898" y="412" class="mono muted" font-size="7.5" letter-spacing="0.8">SOURCE</text>
<text x="898" y="426" class="mono ink" font-size="10">README.md</text>
</svg>
