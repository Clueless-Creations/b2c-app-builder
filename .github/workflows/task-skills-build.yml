name: Task skill final regression verification
# Temporary branch integration only. Removed before rendering and committing the candidate.
on:
  push:
    branches: [feat/task-skills-navigation]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Clueless-Creations/b2c-app-builder' && github.ref == 'refs/heads/feat/task-skills-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task-skills-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Incorporate reviewed upstream changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff d0873cc301fa2487bb22e25af3fe275a624162e0 || {
            while IFS= read -r file; do
              case "$file" in
                SKILL.md|package.json|package-lock.json|skill-version.json) git checkout --ours -- "$file" ;;
                catalog/generated/*|kernel/schema/evidence-schema-version.json) git checkout --theirs -- "$file" ;;
                *) echo "Unreviewed merge conflict: $file"; exit 1 ;;
              esac
              git add -- "$file"
            done < <(git diff --name-only --diff-filter=U)
          }
          test -z "$(git diff --name-only --diff-filter=U)"
      - run: npm ci
      - name: Apply the reviewed fixture and routing adjustments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tooling/finalize-fixture-alignment.py')
          t = p.read_text()
          # Main moved capability-delta to compiled checks: its baseline is now 115.
          # The new repository-only task checker adds exactly one remaining-tsx entry.
          t = t.replace('remaining.length === 116', 'remaining.length === 115').replace('remaining.length === 117', 'remaining.length === 116')
          p.write_text(t)
          sentence = 'Leftover write-gated MCP names stay CLI-only on this local connection when writes are mcp_readonly.'
          anchor = 'Leftover CLI-only public MCP names stay CLI-only on this local connection.'
          for name in ['SKILL.md', 'agents/skills/b2c-app-builder/references/setup.md']:
              p = Path(name)
              t = p.read_text()
              if sentence not in t:
                  assert t.count(anchor) == 1, name
                  p.write_text(t.replace(anchor, anchor + ' ' + sentence))
          PY
          python3 tooling/finalize-fixture-alignment.py
          rm tooling/finalize-fixture-alignment.py .github/workflows/task-skills-build.yml
          npx prettier --write checks/verification/fixtures/firstparty-responsibilities.fixtures.ts checks/verification/fixtures/kitchen-vocabulary.fixtures.ts checks/verification/fixtures/packed-check.fixtures.ts checks/verification/fixtures/mcp.fixtures.ts
          npm run render:all
          npm run render:evidence-schema-version
          npm run check:task-skills
          npm run check:autopilot
          npm run test:fixtures -- firstparty-responsibilities kitchen-vocabulary packed-check
          npm run typecheck
      - name: Commit the clean candidate to the implementation branch
        id: candidate
        run: |
          test "$(git branch --show-current)" = feat/task-skills-navigation
          git add -A
          git commit -m 'Preserve provider defaults and complete navigation, packaging, and MCP regression coverage'
          git push origin HEAD:refs/heads/feat/task-skills-navigation
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Candidate commit: $(git rev-parse HEAD)"
          echo "Candidate tree: $(git rev-parse HEAD^{tree})"
          git bundle create /tmp/task-skills-final-review.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: task-skills-final-review-source
          path: /tmp/task-skills-final-review.bundle
          retention-days: 1
  audit:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            args: --lane fast
          - name: heavy-1
            args: --lane heavy --shard 1/2
          - name: heavy-2
            args: --lane heavy --shard 2/2
    name: Full audit (${{ matrix.name }})
    env:
      B2C_REQUIRE_GIT_HISTORY: '1'
      GITHUB_BASE_SHA: d0873cc301fa2487bb22e25af3fe275a624162e0
      B2C_FIXTURE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node entrypoints/cli/b2c.mjs --help
      - run: npm run audit:ci -- ${{ matrix.args }}
  hosted:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix hosted/knowledge-mcp
      - run: npm run hosted:check
  app:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix hosted/builder-console
      - run: npm run app:check
  complete:
    if: always()
    needs: [integrate, audit, hosted, app]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected suite
        env:
          INTEGRATE: ${{ needs.integrate.result }}
          AUDIT: ${{ needs.audit.result }}
          HOSTED: ${{ needs.hosted.result }}
          APP: ${{ needs.app.result }}
          CANDIDATE: ${{ needs.integrate.outputs.sha }}
        run: |
          test "$INTEGRATE" = success
          test "$AUDIT" = success
          test "$HOSTED" = success
          test "$APP" = success
          echo "Full verification passed for $CANDIDATE"
