<text x="48" y="56" class="mono ink" font-size="10" letter-spacing="0.8">B2C APP BUILDER · SHEET 2 OF 3 · TARGET INTERNAL ARCHITECTURE</text>
<text x="48" y="88" class="serif ink" font-size="24">How a mandate becomes a verified business.</text>
<text x="48" y="108" class="mono muted" font-size="11">Logical boundaries from the north-star architecture. Not every boundary exists in the code yet.</text>

