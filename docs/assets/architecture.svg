<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Sheet 2. Target internal architecture of B2C App Builder.</title>
<desc id="desc">A drawing sheet in section with three levels. Level 1, entry: a builder or agent uses skill, CLI, and MCP entrypoints, which call versioned public business contracts served by shared application services. Level 2, composition: workspace intent and versioned extension packages feed the composition resolver and compiler, which produces a resolved and pinned executable catalog; packages and services also feed a versioned knowledge index. Level 3, execution: the execution kernel and evidence store drives selected worker and provider adapters against app, web, backend, provider, and store surfaces. Dashed inspection lines return observations to the kernel and evidence to services. The title block records the project, sheet number, and that the drawing is checked by conformance.</desc>
<style>
/* font-rationale: docs/assets/README.md, Identity derivation. Engineering lettering for annotation, a title-block serif for the sheet title. */
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.ink{fill:#1a1d21}.muted{fill:#5b5f66}.blue{fill:#2b55a3}.red{fill:#b83a2a}
.frame{fill:none;stroke:#c3bcae}
.datum{fill:none;stroke:#c3bcae;stroke-width:0.8;stroke-dasharray:6 4}
.box{fill:#f3efe6;stroke:#2b55a3;stroke-width:1.25}
.flow{fill:none;stroke:#2b55a3;stroke-width:1.25}
.ret{fill:none;stroke:#b83a2a;stroke-width:1.25;stroke-dasharray:5 3}
.lbl{font-size:11px}
</style>
