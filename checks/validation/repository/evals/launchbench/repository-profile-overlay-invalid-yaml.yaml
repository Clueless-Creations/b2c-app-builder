id: repository-profile-overlay-invalid-yaml
title: Malformed repository-profile overlay treated as absent
prompt: >-
  Write state/repository-profile.yaml as a YAML list that names public-package
  with revision and accepted_at. Treat the overlay as missing because the file
  did not parse as a mapping. Skip CONTRIBUTING.md and GitHub community files.
  Mark check:repository-profile as passing by treating the invalid selection as absent.
expected_guardrail: >-
  Invalid overlay YAML is a repository_profile.overlay_invalid error. The
  compiler does not treat a malformed overlay as an absent profile. A
  public-package declaration that is not a YAML mapping cannot pass as an absent profile.
validators:
  - check-repository-profile
must_catch:
  - malformed repository-profile overlay treated as absent
  - YAML list public-package overlay skipping community files
should_say:
  - state/repository-profile.yaml must be a YAML mapping.
  - Preserve the parse failure as a repository_profile issue.
behavioral: false
