areas:
  - id: area.operating-system
    name: Operating System
    description: Sequences the launch and dispatches the work without confusing durable business structure with runtime execution.
    domain_ids:
      - domain.process
      - domain.orchestration
  - id: area.business-operations-trust
    name: Business Operations And Trust
    description: Runs founder access, account operations, security, privacy, and legal obligations.
    domain_ids:
      - domain.operations
      - domain.trust
  - id: area.product-experience
    name: Product And Experience
    description: Turns evidence into product scope, experience, design, and words.
    domain_ids:
      - domain.research
      - domain.product
      - domain.experience
      - domain.design
      - domain.words
  - id: area.build-release
    name: Build And Release
    description: Builds, proves, signs, packages, and submits the application.
    domain_ids:
      - domain.engineering
      - domain.store
  - id: area.growth-revenue
    name: Growth And Revenue
    description: Prices, measures, distributes, and operates the growth system.
    domain_ids:
      - domain.money
      - domain.growth
      - domain.data
  - id: area.skill-maintenance
    name: Skill Maintenance
    description: Keeps the installed skill, sources, graph, evals, and release contract healthy.
    domain_ids:
      - domain.machine
workflows:
  - id: workflow.orchestration.session-continuity-resume
    title: Session continuity / resume
    domain_id: domain.orchestration
    area_ids:
      - area.operating-system
    trigger: New session, resume, status check, or handoff on an existing launch
    founder_phrasings:
      - catch me up on where this session left off
      - resume where we stopped last time
      - check status before we keep going
      - hand this off to a fresh session
    instructions: "Run `b2c status` and `b2c plan`, then inspect `git status --short` and the relevant authored artifacts before work. Treat `state/business-state.json` as reducer-owned execution state: do not edit it directly. Consult `AGENTS.md`, `operations/ORCHESTRATION.md`, `engineering/PRODUCTION_READINESS.md`, and `operations/FAILURE_CARDS.md` when present. `check:continuity-contract` verifies the installed continuity contract. Prior chat turns do not replace durable evidence."
    reads:
      - state/business-state.json
    consults:
      - AGENTS.md
      - operations/ORCHESTRATION.md
      - engineering/PRODUCTION_READINESS.md
      - operations/FAILURE_CARDS.md
    reference_ids:
      - reference.orchestration.full-launch-program
      - reference.orchestration.parallel-agent-orchestration
      - reference.orchestration.project-state
    role_id: role.orchestrator
    lane_ids:
      - orchestration
    phase_ids: []
    dependencies: []
    output_paths: []
    gate_commands:
      - check:continuity-contract
    provider_ids: []
    founder_only_actions: []
    action_class: observe
    idempotent: true
    applicability:
      mode: always
  - id: workflow.orchestration.orient-scaffold-and-state-cockpit-upkeep
    title: Orient, scaffold & durable state upkeep
    domain_id: domain.orchestration
    area_ids:
      - area.operating-system
    trigger: '"Launch this app" / broad launch request; any lane/provider/proof/blocker status change'
    founder_phrasings:
      - launch this app for me end to end
      - get this business running from scratch
      - pull the overall progress across every workstream
      - something changed and the tracked state needs to catch up
    instructions: Run `b2c status` and `b2c plan` to orient from reducer-owned `state/business-state.json`. Do not edit that file or author a second state document. Submit lane, evidence, and blocker changes through the runtime reducer. A succeeded lane needs evidence or live proof, and a lane cannot succeed while a required upstream lane is running or blocked. Record App Store Connect API-key health and Apple web-session health as two proofs; a healthy API key is not ASC connected. Do not write a signing blocker until `asc certificates list` has been read, and do not treat a local Development keychain as a distribution blocker when App Store Connect already lists Distribution certificates. Do not dispatch research-backed-spec until the live App Store portfolio observe has succeeded. Choose the smallest orchestration strategy that fits the ready work, then report what changed, what happens next, and what needs the human. Do not wait for later operational or readiness artifacts during orientation.
    reads:
      - state/business-state.json
    consults:
      - AGENTS.md
      - PRODUCT.md
      - DESIGN.md
    reference_ids:
      - reference.orchestration.dynamic-workflows
      - reference.orchestration.project-state
      - reference.process.artifact-contracts
      - reference.process.current-truth
      - reference.process.launch-phases
      - reference.process.tool-recipes
    role_id: role.orchestrator
    lane_ids:
      - orchestration
    phase_ids:
      - phase.0-orient
    dependencies: []
    output_paths: []
    gate_commands:
      - check:product-md
    provider_ids: []
    founder_only_actions: []
    action_class: mutate
    idempotent: true
    applicability:
      mode: always
  - id: workflow.orchestration.full-launch-program
    title: Full launch program (entry)
    domain_id: domain.orchestration
    area_ids:
      - area.operating-system
    trigger: Founder asks for a complete end-to-end consumer delivery — app, full web funnel, store packet, analytics, trust, revenue, and growth artifacts — carried to Submit-for-Review ready with isolated review on every surface
    founder_phrasings:
      - run the full launch program on this app
      - take this all the way to submit-for-review ready
      - ship the app, the website, and the store packet as one program
      - every surface gets a fresh-context review before it counts as done
    instructions: "Open the program. Write `operations/LAUNCH_PROGRAM.md` from the mandate record in `reference.orchestration.full-launch-program`: outcome, stop line, launch scope, start classification, workspace facts, craft references, spend ceiling, autonomy mode, founder-only actions, and the review policy. Record `project.launchScope: full` through the reducer with a dated founder reason when it changes an existing scope; never edit `state/business-state.json` by hand. Confirm the `## Review Ledger` section exists in `operations/ORCHESTRATION.md` before any broad dispatch. Present one start-of-workflow tool-intake AskUserQuestion for the account-gated tools on the research-backed-spec compiled graph; fold it into a pending readiness gate; do not open a second tool gate. Name App Store Connect API auth and the live apps-list receipt as required even when optional research tools are deferred. Record API-key health and web-session health as two proofs. Classify the start: a brownfield overhaul runs research in audit-and-gap-fill mode with keep, refresh, or redo per artifact. Do not dispatch research-backed-spec until live-app-store-portfolio has succeeded. Then let `b2c plan` sequence the existing nodes; this node adds the mandate, the isolated-review edges, the reference-pack edge, and the closeout gates, not a second graph. Hand off with the smallest founder-only ask."
    reads:
      - state/business-state.json
    consults:
      - PRODUCT.md
      - DESIGN.md
      - operations/ORCHESTRATION.md
      - strategy/TOOL_DECISIONS.md
      - operations/BUSINESS_ACCESS.md
    reference_ids:
      - reference.design.consumer-craft-benchmarks
      - reference.design.design-evidence-stack
      - reference.design.mobile-flow-craft
      - reference.engineering.external-skill-packs
      - reference.operations.paid-tool-routing
      - reference.orchestration.full-launch-program
      - reference.orchestration.isolated-review
      - reference.orchestration.parallel-agent-orchestration
      - reference.process.launch-coverage
    role_id: role.orchestrator
    lane_ids:
      - orchestration
    phase_ids:
      - phase.0-orient
    dependencies: []
    output_paths:
      - operations/LAUNCH_PROGRAM.md
    gate_commands:
      - check:orchestration
    provider_ids: []
    founder_only_actions:
      - "Approve the full launch program mandate: launch scope full, the Submit-for-Review stop line, the spend ceiling, and the autonomy mode"
    action_class: mutate
    idempotent: true
    applicability:
      mode: conditional
      question: Did the founder ask for the full end-to-end launch program (launch scope full, Submit-for-Review stop line)?
  - id: workflow.orchestration.full-launch-closeout
    title: Full launch closeout (definition of done)
    domain_id: domain.orchestration
    area_ids:
      - area.operating-system
    trigger: Every store, trust, engineering, and growth terminal node has succeeded and the founder wants the Submit-for-Review handoff
    founder_phrasings:
      - are we actually ready for me to click submit
      - show me the final checklist before I submit for review
      - close out the launch and tell me the one thing left
    instructions: "Close the program against the definition-of-done table in `reference.orchestration.full-launch-program`. Write `LAUNCH.md` as the launch dossier: the store-console click path ending at Submit for Review, pointers to the listing, screenshots, signing, console, email, and revenue artifacts, the launch calendar, the monetization thresholds, and the open founder decisions. Confirm every lane is done, blocked with a founder action, or deferred with a dated reason the founder accepted. Confirm the review ledger holds a passing row for every producer-to-auditor pair and that each findings artifact exists. Confirm `engineering/PRODUCTION_READINESS.md` carries physical-device evidence, not simulator-only proof. Run `check:lane-coverage`, `check:orchestration`, `check:readiness-coverage`, and `check:app-copy`; do not narrate readiness a gate contradicts. Hand off what the founder clicks, in order, and the one remaining founder action. You never click Submit for Review."
    reads:
      - state/business-state.json
      - operations/LAUNCH_PROGRAM.md
      - operations/ORCHESTRATION.md
      - engineering/PRODUCTION_READINESS.md
      - store/STORE_CONSOLE.md
      - product/copy/COPY_REVIEW.md
      - design/reviews/DESIGN_SYSTEM_REVIEW.md
    consults:
      - growth/CRO_AUDIT.md
      - strategy/RED_TEAM_FINDINGS.md
      - LEGAL_REVIEW.md
      - growth/EMAIL_OPS.md
      - revenue/REVENUE_OPS.md
    reference_ids:
      - reference.design.design-acceptance
      - reference.orchestration.full-launch-program
      - reference.orchestration.isolated-review
      - reference.process.failure-cards
      - reference.process.launch-coverage
      - reference.store.store-console-workflow
    role_id: role.orchestrator
    lane_ids:
      - orchestration
    phase_ids: []
    dependencies:
      - workflow.orchestration.full-launch-program
      - workflow.store.store-console-workflow
      - workflow.store.apple-signing-and-release-readiness
      - workflow.store.marketplace-regional-compliance
      - workflow.trust.privacy-and-terms
      - workflow.trust.security-architecture-and-release-gate
      - workflow.engineering.engineering-orchestration-ce-production-readiness
      - workflow.engineering.accessibility-common-task-proof
      - workflow.engineering.app-quality-and-vitals
      - workflow.growth.landing-funnel-publication-and-live-proof
      - workflow.growth.landing-funnel-audit
      - workflow.words.copy-review-audit
      - workflow.design.design-system-audit
      - workflow.design.implementation-craft-audit
      - workflow.experience.onboarding-conversion
      - workflow.growth.launch-narrative-and-cadence
      - workflow.operations.post-launch-operations
      - workflow.process.launchbench-failure-cards-coverage-audit
    output_paths:
      - LAUNCH.md
    gate_commands:
      - check:lane-coverage
      - check:orchestration
      - check:readiness-coverage
      - check:app-copy
      - check:design-acceptance
    provider_ids: []
    founder_only_actions: []
    action_class: observe
    idempotent: true
    applicability:
      mode: conditional
      question: Did the founder ask for the full end-to-end launch program (launch scope full, Submit-for-Review stop line)?
  - id: workflow.process.provider-proof-verification
    title: Provider-proof verification
    domain_id: domain.process
    area_ids:
      - area.operating-system
    trigger: Before marking any provider-backed lane (analytics/revenue/email/store/security/eng) succeeded
    founder_phrasings:
      - prove this integration is actually wired up, not just coded
      - show real evidence a provider is live before calling it done
      - don't mark this finished without proof it works
    instructions: "Before marking any provider-backed lane (analytics/revenue/email/store/security/eng) succeeded, populate or update `operations/PROVIDER_PROOF.md` with one row per provider: name, current status, proof command or inspection route, evidence path, and any founder-only gate. Planned setup and green unit tests are not proof. The row's status must show captured live evidence, and `check:provider-proof` fails unless at least one file named anywhere in the row exists on disk. If access is founder-only, record the gate and keep the lane running or blocked rather than claiming success."
    reads:
      - state/business-state.json
    consults:
      - operations/PROVIDER_PROOF.md
    reference_ids:
      - reference.process.launch-coverage
      - reference.process.provider-contracts
      - reference.process.provider-proof
    role_id: role.orchestrator
    lane_ids: []
    phase_ids: []
    dependencies:
      - workflow.operations.agent-operations-ledger
    output_paths:
      - operations/PROVIDER_PROOF.md
    gate_commands:
      - check:provider-proof
    provider_ids:
      - provider.posthog
      - provider.revenuecat
      - provider.resend
      - provider.app-store-connect
    founder_only_actions: []
    action_class: observe
    idempotent: true
    applicability:
      mode: always
  - id: workflow.process.change-cascade
    title: Change cascade
    domain_id: domain.process
    area_ids:
      - area.operating-system
    trigger: When DESIGN.md is accepted, and after each app, product, copy, brand, pricing, product, or data change
    founder_phrasings:
      - we changed something, what else needs updating because of it
      - ripple this edit through every surface it touches
      - make sure nothing was left stale after that change
    instructions: Run a design_contract_lock cascade when DESIGN.md is first accepted. This creates the public-surface baseline while app implementation starts. After that, ingest engineering/SOURCE_CHANGE_MANIFEST.json and classify each accepted change with every applicable Change Cascade Map type, not one convenient primary type. Use agents/launch-surface-producer.md for the surface audit and bounded update tasks. Check the app, Apple App Store, Google Play, Apple and Play products, billing, landing site, web onboarding, GEO/SEO, lifecycle email, analytics, legal pages and public privacy claims, screenshots, and marketing assets. Update each affected surface or record why it is unaffected. Submit any lane or evidence transitions through the reducer; do not write them into an authored state document. Updated localized, product, device, product-page, or asset surfaces need one evidence variant per applicable dimension. Re-render any screenshot, App Preview, Play feature graphic, landing screenshot, or ad asset whose source digest changed. Reconcile the locked lexicon in DESIGN.md before the change succeeds and write the checked ledger digest to state/CHANGE_CASCADE_RECEIPT.json.
    reads:
      - state/business-state.json
      - state/LAUNCH_TRACE.md
      - DESIGN.md
      - engineering/SOURCE_CHANGE_MANIFEST.json
    consults: []
    reference_ids:
      - reference.process.cascade-edges
      - reference.process.change-cascade
      - reference.process.flow-traceability
    role_id: role.orchestrator
    lane_ids: []
    phase_ids: []
    dependencies: []
    output_paths:
      - state/CHANGE_CASCADE_RECEIPT.json
    gate_commands: []
    provider_ids: []
    founder_only_actions: []
    action_class: mutate
    idempotent: true
    applicability:
      mode: always
  - id: workflow.process.launch-trace-and-build-contracts
    title: Launch trace & build contracts
    domain_id: domain.process
    area_ids:
      - area.operating-system
    trigger: Crossing research → product/design/build; deciding if engineering/TECH_SPEC.md is needed
    founder_phrasings:
      - trace every decision back to the evidence that justified it
      - decide if we need a real technical spec before building
      - connect the research to what we're actually building
    instructions: When work crosses from research into product/design/build, create or update `state/LAUNCH_TRACE.md` as the decision-trace table (evidence ID, source, tool route, research finding, experience/product/brand decision, build contract, analytics/security/revenue/privacy/store impact, verification, status) so every screen, claim, or paywall behavior traces back to the evidence that produced it. Decide whether `engineering/TECH_SPEC.md` is needed — create it when the app has backend APIs, database/storage, auth, subscriptions, email, analytics, AI, push, account deletion, or non-trivial platform behavior, and cover the data model, API/RPC/webhook contracts, state machines, permissions, and integration contracts so a builder never has to invent schema or endpoint behavior. Do not let a claim, screen, onboarding question, or paywall behavior move forward without a trace row or an explicit, documented founder-only decision.
    reads:
      - strategy/RESEARCH.md
      - product/experience/11-star-experience/11_STAR_EXPERIENCE.md
      - state/business-state.json
    consults: []
    reference_ids:
      - reference.process.artifact-contracts
      - reference.process.flow-traceability
      - reference.process.launch-coverage
    role_id: role.product-leader
    lane_ids:
      - traceability
    phase_ids:
      - phase.1f
    dependencies:
      - workflow.research.research-backed-spec
      - workflow.experience.11-star-experience
    output_paths:
      - state/LAUNCH_TRACE.md
      - engineering/TECH_SPEC.md
    gate_commands: []
    provider_ids: []
    founder_only_actions: []
    action_class: draft
    idempotent: true
    applicability:
      mode: always
  - id: workflow.process.launchbench-failure-cards-coverage-audit
    title: LaunchBench / failure-cards / coverage audit
    domain_id: domain.process
    area_ids:
      - area.operating-system
    trigger: Before any launch-readiness claim, after a repeated miss, or adding a validator/scenario
    founder_phrasings:
      - we keep making the same mistake, turn it into a permanent check
      - make sure test coverage backs up a launch-readiness claim
      - log this failure so it never slips through again
    instructions: Before any launch-readiness claim, after a repeated agent miss, or when adding a validator or scenario, run `npm run launchbench` (definition lint plus the validator fixture suite) and turn any known regression into a durable card in `operations/FAILURE_CARDS.md` (card ID, severity, owner, status, detected date, evidence, impact, next action, validator) instead of leaving it as a chat note. Record scenarios run, validators run, expected failures caught, and unexpected misses in `LAUNCHBENCH.md`. Close a card only with evidence or command proof attached. The node's deterministic gate is `launchbench:lint` — scenario YAML shape only — so a session does not re-run the fixture suite that CI already runs on the heavy lane. Use `b2c status` and `b2c plan` to confirm that reducer-owned lane state does not support a launch-ready claim while an upstream lane is still running or blocked.
    reads:
      - state/business-state.json
      - engineering/PRODUCTION_READINESS.md
    consults:
      - operations/FAILURE_CARDS.md
    reference_ids:
      - reference.process.artifact-contracts
      - reference.process.failure-cards
      - reference.process.launch-coverage
    role_id: role.orchestrator
    lane_ids: []
    phase_ids: []
    dependencies:
      - workflow.orchestration.orient-scaffold-and-state-cockpit-upkeep
    output_paths:
      - operations/FAILURE_CARDS.md
      - LAUNCHBENCH.md
    gate_commands:
      - launchbench:lint
    provider_ids: []
    founder_only_actions: []
    action_class: observe
    idempotent: true
    applicability:
      mode: always
  - id: workflow.process.repository-profile-contract
    title: Compile the repository profile contract
    domain_id: domain.process
    area_ids:
      - area.operating-system
    trigger: Selecting the repository kind for a workspace, or compiling its artifact and validator contract
    founder_phrasings:
      - figure out what kind of repository this actually is
      - set the rules this workspace has to follow
      - pick the artifact and validator contract for this repo kind
    instructions: Accept one typed repository profile in reducer-owned project state. Compile the applicable artifact and validator contract from that profile plus the active capability graph. A profile cannot suppress privacy, secrets, authorization, billing, account deletion, provider proof, or release-truth gates when those capabilities are present.
    reads:
      - state/business-state.json
    consults: []
    reference_ids:
      - reference.process.repository-profiles
    role_id: role.orchestrator
    lane_ids: []
    phase_ids: []
    dependencies: []
    output_paths:
      - state/generated/requirement-inventory.json
      - state/generated/requirement-inventory.md
    gate_commands: []
    provider_ids: []
    founder_only_actions: []
    action_class: mutate
    idempotent: true
    applicability:
      mode: always
  - id: workflow.operations.paid-tool-routing-and-fallback
    title: Paid-tool routing & fallback
    domain_id: domain.operations
    area_ids:
      - area.business-operations-trust
    trigger: Before using or replacing any paid/account-gated tool, or before a free fallback
    founder_phrasings:
      - check if we already have access before paying for a tool
      - route around a tool that needs an account we don't have
      - find the free fallback instead of a paid service
