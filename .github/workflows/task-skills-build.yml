name: Task skill integration inputs (temporary)

# Read-only branch tooling. Removed before merge; no deployment or release.
on:
  push:
    branches: [feat/task-skills-navigation]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Clueless-Creations/b2c-app-builder' && github.ref == 'refs/heads/feat/task-skills-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover public source for review
        run: |
          mkdir -p /tmp/task-skill-inputs
          git bundle create /tmp/task-skill-inputs/source.bundle --all
          cp tooling/task-skills-integration.patch.gz.b64 /tmp/task-skill-inputs/
      - uses: actions/upload-artifact@v4
        with:
          name: task-skill-recovered-source
          path: /tmp/task-skill-inputs
          retention-days: 1
