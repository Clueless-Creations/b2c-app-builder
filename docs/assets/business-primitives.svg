<rect x="845" y="466" width="64" height="18" class="plate"/><text x="877" y="479" class="mono ink" font-size="10.5" text-anchor="middle">EVIDENCE</text>

<!-- notes -->
<text x="48" y="536" class="mono muted" font-size="9.5">First, one excellent business. Then a distinct sibling. Then a market of independent experiments.</text>
<text x="48" y="554" class="mono muted" font-size="9.5">Sheet 2 draws the internal architecture. Sheet 3 draws one station in detail.</text>

